# Chạy toàn bộ local bằng một lệnh, dữ liệu trên Postgres như production:
#   docker compose up --build
# Frontend: http://localhost:3000 · Backend: http://localhost:8000/docs · Postgres: localhost:5432 (learnhub/learnhub)
# Cấu hình bí mật (mail, Google, ngân hàng, S3, Anthropic...) đọc từ backend/.env nếu có; không có vẫn chạy ở chế độ dev.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: learnhub
      POSTGRES_PASSWORD: learnhub
      POSTGRES_DB: learnhub
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learnhub -d learnhub"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql://learnhub:learnhub@db:5432/learnhub
      CORS_ORIGINS: http://localhost:3000
      FRONTEND_URL: http://localhost:3000
      TRUST_PROXY_HEADERS: "false"
    ports:
      - "8000:8000"
    # Dev: mount code để uvicorn --reload nhận thay đổi. Bỏ 2 dòng volumes/command để chạy như image production.
    volumes:
      - ./backend/app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  web:
    image: node:20-alpine
    working_dir: /app
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
      - web_next:/app/.next
    ports:
      - "3000:3000"
    command: sh -c "npm ci && npm run dev -- -H 0.0.0.0"

volumes:
  pgdata:
  web_node_modules:
  web_next:
