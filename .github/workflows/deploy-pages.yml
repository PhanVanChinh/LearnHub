name: CI & Deploy

# Mọi push lên main / PR: chạy test backend (SQLite + Postgres thật), typecheck frontend, build image backend.
# Chỉ khi tất cả xanh mới build & deploy site tĩnh lên GitHub Pages (không deploy với pull_request).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Nút "Xuất bản" trong admin (POST /api/admin/publish) gửi repository_dispatch → build lại từ DB hiện tại
  repository_dispatch:
    types: [publish-courses]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: true

jobs:
  test-backend:
    name: Backend tests (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: learnhub_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: pytest
        run: python -m pytest -q
        env:
          # SQLite: conftest tự dùng test.db. Postgres: trỏ vào service container.
          TEST_DATABASE_URL: ${{ matrix.db == 'postgres' && 'postgresql://postgres:postgres@localhost:5432/learnhub_test' || '' }}

  check-frontend:
    name: Frontend typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit -p .

  docker-backend:
    name: Build backend image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: docker build
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          load: true
          tags: learnhub-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test image (khởi động, gọi /api/health)
        run: |
          docker run -d --name api -p 8000:8000 -e SECRET_KEY=ci-only-secret-key-not-for-production learnhub-api:ci
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8000/api/health; then echo; echo "OK"; exit 0; fi; sleep 1
          done
          echo "Backend không khởi động được:"; docker logs api; exit 1

  build:
    name: Build static site
    needs: [test-backend, check-frontend, docker-backend]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Enable GitHub Pages for this repo (lần đầu)
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - run: npm ci
      - name: Build static site
        run: npm run build
        env:
          STATIC_EXPORT: "1"
          # Repo tên LearnHub → site ở https://phanvanchinh.github.io/LearnHub/
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # URL backend công khai (Render, Railway, ...). Lúc build, lib/courses.server.ts gọi /api/courses/export
          # để lấy khóa học từ DB; không gọi được → dùng data/courses.ts, build vẫn thành công.
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
